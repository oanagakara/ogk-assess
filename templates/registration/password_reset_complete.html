{% extends "assessment/base.html" %}
{% block title %}Password Reset Complete{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-4">
  <div class="card w-full max-w-md bg-base-100 shadow-xl">
    <div class="card-body space-y-4">
      <h1 class="card-title text-2xl">Password updated</h1>
      <p class="text-sm opacity-70">Your password has been set. You can now sign in.</p>
      <a href="{% url 'login' %}" class="btn btn-primary w-full">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
