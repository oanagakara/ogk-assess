{% extends "assessment/base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-4">
  <div class="card w-full max-w-md bg-base-100 shadow-xl">
    <div class="card-body space-y-4">
      <h1 class="card-title text-2xl">Assessor login</h1>

      {% if form.errors %}
        <div class="alert alert-error">
          <span>Your username or password was incorrect.</span>
        </div>
      {% endif %}

      <form method="post" class="space-y-4">
        {% csrf_token %}

        <div class="form-control">
          <label class="label"><span class="label-text">Username</span></label>
          <input class="input input-bordered w-full" type="text" name="username" autofocus required>
        </div>

        <div class="form-control">
          <label class="label"><span class="label-text">Password</span></label>
          <input class="input input-bordered w-full" type="password" name="password" required>
        </div>

        {% if next %}
          <input type="hidden" name="next" value="{{ next }}">
        {% endif %}

        <button class="btn btn-primary w-full" type="submit">Log in</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
