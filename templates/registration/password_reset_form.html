{% extends "assessment/base.html" %}
{% block title %}Reset Password{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-4">
  <div class="card w-full max-w-md bg-base-100 shadow-xl">
    <div class="card-body space-y-4">
      <h1 class="card-title text-2xl">Reset your password</h1>
      <p class="text-sm opacity-60">Enter your email address and we'll send you a reset link.</p>

      <form method="post" class="space-y-4">
        {% csrf_token %}
        <div class="form-control">
          <label class="label"><span class="label-text">Email address</span></label>
          <input class="input input-bordered w-full" type="email" name="email" autofocus required>
        </div>
        <button class="btn btn-primary w-full" type="submit">Send reset link</button>
      </form>

      <div class="text-center text-sm opacity-60">
        <a href="{% url 'login' %}" class="link">Back to sign in</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
