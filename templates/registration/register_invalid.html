{% extends "assessment/base.html" %}
{% block title %}Invalid Invite{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-4">
  <div class="card w-full max-w-md bg-base-100 shadow-xl">
    <div class="card-body space-y-4">
      <h1 class="card-title text-2xl">Invite link invalid</h1>
      <p class="text-sm opacity-70 leading-relaxed">
        This invite link has already been used or has expired. Please ask your trainer to generate a new one.
      </p>
      <a href="{% url 'login' %}" class="btn btn-ghost w-full">Back to sign in</a>
    </div>
  </div>
</div>
{% endblock %}
