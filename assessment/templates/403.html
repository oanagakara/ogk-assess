<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>(function(){var t=localStorage.getItem("theme")||"business";document.documentElement.setAttribute("data-theme",t);})();</script>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <title>Access Denied</title>
</head>
<body class="min-h-screen bg-base-200 text-base-content flex items-center justify-center p-6">
    <div class="card bg-base-100 shadow-xl w-full max-w-lg">
        <div class="card-body space-y-6">
            <div class="flex items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="text-error shrink-0" width="32" height="32"
                     fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/>
                </svg>
                <h1 class="text-2xl font-bold">Access Denied</h1>
            </div>
            <p class="opacity-70">You do not have permission to access this page. If you believe this is an error, please contact the administrator.</p>
            <div class="bg-base-200 rounded-lg p-4 font-mono text-sm space-y-1">
                <div><span class="opacity-50">Error:</span> {{ error_type }}</div>
                <div><span class="opacity-50">Detail:</span> <span class="break-all">{{ error_msg }}</span></div>
            </div>
            <p class="text-sm opacity-60">The administrator has been notified.</p>
            <a href="/" class="btn btn-ghost btn-sm">Return to start</a>
        </div>
    </div>
</body>
</html>
