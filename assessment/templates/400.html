<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>(function(){var t=localStorage.getItem("theme")||"business";document.documentElement.setAttribute("data-theme",t);})();</script>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <title>Bad Request</title>
</head>
<body class="min-h-screen bg-base-200 text-base-content flex items-center justify-center p-6">
    <div class="card bg-base-100 shadow-xl w-full max-w-lg">
        <div class="card-body space-y-6">
            <div class="flex items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="text-warning shrink-0" width="32" height="32"
                     fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M9.879 7.519c1.171-1.025 3.071-1.025 4.242 0 1.172 1.025 1.172 2.687 0 3.712-.203.179-.43.326-.67.442-.745.361-1.45.999-1.45 1.827v.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 5.25h.008v.008H12v-.008Z"/>
                </svg>
                <h1 class="text-2xl font-bold">Bad Request</h1>
            </div>
            <p class="opacity-70">The system could not process this request. Please go back and try again.</p>
            <div class="bg-base-200 rounded-lg p-4 font-mono text-sm space-y-1">
                <div><span class="opacity-50">Error:</span> {{ error_type }}</div>
                <div><span class="opacity-50">Detail:</span> <span class="break-all">{{ error_msg }}</span></div>
            </div>
            <p class="text-sm opacity-60">The administrator has been notified.</p>
            <a href="/" class="btn btn-ghost btn-sm">Return to start</a>
        </div>
    </div>
</body>
</html>
