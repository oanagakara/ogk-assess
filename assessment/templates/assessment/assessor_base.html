{% extends "assessment/base.html" %}

{% block content %}
<div class="min-h-screen bg-base-200 text-base-content">
    <div class="navbar bg-base-100 border-b border-base-300 px-4 md:px-6 shadow-sm">
        <div class="flex-1">
            <a href="{% url 'assessment:assessor_dashboard' %}" class="text-lg font-semibold">
                Assessor Console
            </a>
        </div>

        <div class="flex-none flex items-center gap-2">
            <a
                href="{% url 'assessment:assessor_dashboard' %}"
                class="btn btn-sm {% if request.resolver_match.url_name == 'assessor_dashboard' %}btn-primary{% else %}btn-ghost{% endif %}"
            >
                Dashboard
            </a>

            <a
                href="{% url 'assessment:assessor_attempts' %}"
                class="btn btn-sm {% if request.resolver_match.url_name == 'assessor_attempts' or request.resolver_match.url_name == 'assessor_mark_attempt' %}btn-primary{% else %}btn-ghost{% endif %}"
            >
                Attempts
            </a>

            <a
                href="{% url 'assessment:assessor_new_attempt' %}"
                class="btn btn-sm {% if request.resolver_match.url_name == 'assessor_new_attempt' %}btn-primary{% else %}btn-ghost{% endif %}"
            >
                New Code
            </a>
        </div>
            <form method="post" action="{% url 'logout' %}" class="inline">
              {% csrf_token %}
              <button class="btn btn-sm" type="submit">Logout</button>
            </form>
    </div>

    <main class="p-4 md:p-6">
        {% block assessor_content %}{% endblock %}
    </main>
</div>
{% endblock %}
