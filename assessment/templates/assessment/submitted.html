{% extends "assessment/base.html" %}
{% block title %}Submitted{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-4">
  <div class="card w-full max-w-2xl bg-base-100 shadow-xl">
    <div class="card-body space-y-4">
      <h1 class="card-title text-2xl">Submitted</h1>
      <p>Your assessment has been submitted successfully.</p>

      <div class="divider my-0"></div>

      <div class="text-sm opacity-70">
        <p><strong>Code:</strong> {{ attempt.code }}</p>
        <p><strong>Submitted at:</strong> {{ attempt.submitted_at }}</p>
      </div>

      <div class="pt-2 flex justify-end">
        <a class="btn btn-primary" href="/start/">Finish</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
