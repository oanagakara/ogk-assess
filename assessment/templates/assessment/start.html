<!doctype html>
<html data-theme="dark">
  <head>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
  </head>
  <body class="min-h-screen bg-base-200">
    <div class="min-h-screen flex items-center justify-center p-4">
      <div class="card w-full max-w-md bg-base-100 shadow-xl">
        <div class="card-body">
          <h1 class="card-title text-2xl">Start assessment</h1>
          <p class="text-sm opacity-70">Enter the assessment code you were given.</p>
          <form method="post" class="mt-4 space-y-4">
            {% csrf_token %}
            <div class="form-control">
              {{ form.code.label_tag }}
              {{ form.code }}
              {% if form.code.errors %}
              <div class="text-error text-sm mt-1">{{ form.code.errors|striptags }}</div>
              {% endif %}
            </div>
            <button class="btn btn-primary w-full" type="submit">Start</button>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
