{% extends "assessment/base.html" %}
{% block title %}Session expired{% endblock %}

{% block content %}
  <div class="min-h-[calc(100vh-6rem)] flex items-center justify-center px-4">
    <div class="w-full" style="max-width:1400px;">
      <div class="card bg-base-100 shadow-xl">
        <div class="card-body p-6 md:p-8 text-center space-y-4">
          <h1 class="card-title text-2xl justify-center">Session expired</h1>
          <p class="opacity-70">
            Session <strong>{{ session.code }}</strong> has ended.
            Please ask your assessor for assistance.
          </p>
          <a href="/start/" class="btn">Back to start</a>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
