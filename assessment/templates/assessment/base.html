<!doctype html>
<html data-theme="business">
    <head>
        {% load static %}
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="{% static 'css/output.css' %}">
        <title>{% block title %}Assessment{% endblock %}</title>
    </head>
    <body class="min-h-screen bg-base-200 text-base-content">
        <div class="min-h-screen">
            <div class="flex justify-end p-4 md:p-6">
                <label class="flex cursor-pointer gap-2">
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    >
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                    <input type="checkbox" id="theme-toggle" class="toggle" />
                    <svg
                        xmlns="http://www.w3.org/2000/svg"
                        width="20"
                        height="20"
                        viewBox="0 0 24 24"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round">
                      <circle cx="12" cy="12" r="5"/>
                      <path 
                          d="M12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 
                          18.4l1.4 1.4M1 12h2M21 12h2M4.2 
                          19.8l1.4-1.4M18.4 5.6l1.4-1.4" />
                    </svg>
               </label>
            </div>

            {% block content %}{% endblock %}
        </div>

        <script>
            document.addEventListener("DOMContentLoaded", function () {
                const root = document.documentElement;
                const savedTheme = localStorage.getItem("theme") || "business";
                root.setAttribute("data-theme", savedTheme);

                const toggle = document.getElementById("theme-toggle");
                if (!toggle) return;

                toggle.checked = savedTheme === "corporate";

                toggle.addEventListener("change", function () {
                    const nextTheme = toggle.checked ? "corporate" : "business";
                    root.setAttribute("data-theme", nextTheme);
                    localStorage.setItem("theme", nextTheme);
                });
            });
        </script>
    </body>
</html>
