<!doctype html>
<html>
    <head>
        {% load static %}
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <!-- Apply saved theme before paint to prevent flash -->
        <script>
            (function () {
                var t = localStorage.getItem("theme") || "business";
                document.documentElement.setAttribute("data-theme", t);
            })();
        </script>
        <link rel="stylesheet" href="{% static 'css/output.css' %}">
        {% if tenant.favicon_url %}<link rel="icon" href="{{ tenant.favicon_url }}">{% endif %}
        {% if brand_css_vars %}<style>:root { {{ brand_css_vars }} }</style>{% endif %}
        <title>{% block title %}Assessment{% endblock %}{% if tenant %} — {{ tenant.name }}{% endif %}</title>
    </head>
    <body class="min-h-screen bg-base-200 text-base-content">

        {% block body %}
        <div class="min-h-screen">
            <div class="flex justify-end p-4">
                <label class="flex cursor-pointer items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
                         viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21.752 15.002A9.72 9.72 0 0 1 18 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 0 0 3 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 0 0 9.002-5.998Z"/>
                    </svg>
                    <input type="checkbox" id="theme-toggle" class="toggle toggle-sm"/>
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="none"
                         viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"
                         stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 3v2.25m6.364.386-1.591 1.591M21 12h-2.25m-.386 6.364-1.591-1.591M12 18.75V21m-4.773-4.227-1.591 1.591M5.25 12H3m4.227-4.773L5.636 5.636M15.75 12a3.75 3.75 0 1 1-7.5 0 3.75 3.75 0 0 1 7.5 0Z"/>
                    </svg>
                </label>
            </div>
            {% block content %}{% endblock %}
        </div>

        <script>
            (function () {
                var root = document.documentElement;
                var toggle = document.getElementById("theme-toggle");
                if (!toggle) return;
                var saved = localStorage.getItem("theme") || "business";
                toggle.checked = (saved === "corporate");
                toggle.addEventListener("change", function () {
                    var next = toggle.checked ? "corporate" : "business";
                    root.setAttribute("data-theme", next);
                    localStorage.setItem("theme", next);
                });
            })();
        </script>
        {% endblock %}

    </body>
</html>
