<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>
        (function () {
            var t = localStorage.getItem("theme") || "business";
            document.documentElement.setAttribute("data-theme", t);
        })();
    </script>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <title>System Error</title>
</head>
<body class="min-h-screen bg-base-200 text-base-content flex items-center justify-center p-6">
    <div class="card bg-base-100 shadow-xl w-full max-w-lg">
        <div class="card-body space-y-6">

            <div class="flex items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="text-error shrink-0" width="32" height="32"
                     fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126ZM12 15.75h.007v.008H12v-.008Z"/>
                </svg>
                <h1 class="text-2xl font-bold">The system encountered an error</h1>
            </div>

            <p class="opacity-70">
                The page could not load. Your work has not been lost.
                Please contact the administrator for assistance.
            </p>

            <div class="bg-base-200 rounded-lg p-4 font-mono text-sm space-y-1">
                <div><span class="opacity-50">Error:</span> <span id="err-type">{{ error_type }}</span></div>
                <div><span class="opacity-50">Detail:</span> <span id="err-msg" class="break-all">{{ error_msg }}</span></div>
            </div>

            <p class="text-sm opacity-60" id="notify-status">
                The administrator has been notified.
            </p>

            <div class="flex flex-col sm:flex-row gap-3">
                <button id="report-btn" class="btn btn-error btn-sm">
                    Send report again
                </button>
                <a href="/" class="btn btn-ghost btn-sm">Return to start</a>
            </div>

        </div>
    </div>

    <script>
        document.getElementById("report-btn").addEventListener("click", function () {
            var btn = this;
            btn.disabled = true;
            btn.textContent = "Sending…";
            fetch("/error-report/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    error_type: document.getElementById("err-type").textContent,
                    error_msg:  document.getElementById("err-msg").textContent,
                    url:        window.location.href
                })
            })
            .then(function (r) { return r.json(); })
            .then(function (d) {
                document.getElementById("notify-status").textContent =
                    d.ok ? "Report sent. The administrator has been notified." : "Could not send report. Please contact the administrator directly.";
                btn.textContent = "Sent";
            })
            .catch(function () {
                document.getElementById("notify-status").textContent = "Could not send report. Please contact the administrator directly.";
                btn.disabled = false;
                btn.textContent = "Try again";
            });
        });
    </script>
</body>
</html>
