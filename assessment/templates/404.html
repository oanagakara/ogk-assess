<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script>(function(){var t=localStorage.getItem("theme")||"business";document.documentElement.setAttribute("data-theme",t);})();</script>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <title>Page Not Found</title>
</head>
<body class="min-h-screen bg-base-200 text-base-content flex items-center justify-center p-6">
    <div class="card bg-base-100 shadow-xl w-full max-w-lg">
        <div class="card-body space-y-6">
            <div class="flex items-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" class="text-info shrink-0" width="32" height="32"
                     fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75">
                    <path stroke-linecap="round" stroke-linejoin="round"
                          d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"/>
                </svg>
                <h1 class="text-2xl font-bold">Page Not Found</h1>
            </div>
            <p class="opacity-70">The page you are looking for does not exist or may have moved.</p>
            <div class="bg-base-200 rounded-lg p-4 font-mono text-sm">
                <span class="opacity-50">Path:</span> <span class="break-all">{{ error_msg }}</span>
            </div>
            <p class="text-sm opacity-60">The administrator has been notified.</p>
            <a href="/" class="btn btn-ghost btn-sm">Return to start</a>
        </div>
    </div>
</body>
</html>
