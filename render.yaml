services:
  - type: web
    name: ican-assessment
    runtime: python
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application --workers 3 --threads 2 --worker-class gthread --timeout 60 --forwarded-allow-ips '*'"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: ican-assessment-db
          property: connectionString

databases:
  - name: ican-assessment-db
    plan: starter
